name: Build Tuts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:boundaries
      - run: node scripts/document-service-inventory.mjs --check
      - run: pnpm typecheck
      - run: pnpm -r --no-bail --if-present test
      - run: node scripts/test-workbook-runtime.mjs
